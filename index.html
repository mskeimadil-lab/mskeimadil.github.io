<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجريدة العالمية | أخبار عاجلة تلقائية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>📰 الجريدة العالمية</h1>
            <p>أخبار عاجلة تتحدث تلقائياً كل ساعة</p>
        </div>
        <div class="last-update" id="lastUpdate">جاري التحميل...</div>
    </header>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 ابحث في الأخبار العاجلة...">
    </div>

    <nav class="categories" id="categoryTabs">
        <button class="active" onclick="filterCategory('الكل')">الكل</button>
        <button onclick="filterCategory('عاجل وعالمي')">🌍 عاجل وعالمي</button>
        <button onclick="filterCategory('تكنولوجيا')">💻 تكنولوجيا</button>
        <button onclick="filterCategory('رياضة')">⚽ رياضة</button>
        <button onclick="filterCategory('اقتصاد')">📈 اقتصاد</button>
    </nav>

    <main class="container">
        <div id="newsGrid" class="news-grid">
            <p class="loading">جاري جلب أحدث الأخبار...</p>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; الجريدة العالمية - تحديث تلقائي بواسطة GitHub Actions</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
