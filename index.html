<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجريدة العالمية | الأخبار المباشرة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>📰 الجريدة العالمية</h1>
            <p>تغطية إخبارية شاملة تتحديث أوتوماتيكياً كل ساعة</p>
        </div>
        <div class="last-update" id="lastUpdate">جاري التحميل...</div>
    </header>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 ابحث في العناوين والأخبار...">
    </div>

    <nav class="categories" id="categoryTabs">
        <button class="active" onclick="filterCategory('الكل')">الكل</button>
        <button onclick="filterCategory('عاجل وعالمي')">🌍 عاجل وعالمي</button>
        <button onclick="filterCategory('تكنولوجيا')">💻 تكنولوجيا</button>
        <button onclick="filterCategory('رياضة')">⚽ رياضة</button>
        <button onclick="filterCategory('اقتصاد')">📈 اقتصاد</button>
    </nav>

    <!-- وحدة الإعلان المباشرة في أعلى الصفحة -->
    <div style="text-align: center; margin: 15px auto; max-width: 100%; overflow: hidden;">
        <script async="async" data-cfasync="false" src="https://pl31174834.profitableratecpmnetwork.com/16862be26721288d37d8fc1d7d7cfba0/invoke.js"></script>
        <div id="container-16862be26721288d37d8fc1d7d7cfba0"></div>
    </div>

    <main class="container">
        <div id="newsGrid" class="news-grid"></div>
    </main>

    <!-- نافذة قراءة الخبر داخل الموقع -->
    <div id="articleModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" onclick="closeArticle()">✕ إغلاق</button>
            <div class="modal-body">
                <span id="modalCategory" class="tag"></span>
                <span id="modalSource" class="source"></span>
                <h2 id="modalTitle"></h2>
                <div id="modalDate" class="date-time"></div>
                
                <img id="modalImage" src="" alt="صورة الخبر" class="modal-img">
                <p id="modalDesc" class="article-text"></p>
                
                <div class="modal-actions">
                    <a id="modalSourceLink" href="#" target="_blank" class="btn-external">الانتقال للمصدر الأصلي ↗</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; الجريدة العالمية</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
