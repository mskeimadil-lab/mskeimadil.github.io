name: Hourly Auto News Fetcher

on:
  schedule:
    - cron: '0 * * * *'  # تشغيل تلقائي كل 60 دقيقة
  workflow_dispatch:      # إمكانية التشغيل اليدوي من GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Fetch Latest News
        run: python fetch_news.py

      - name: Commit & Push Updated News
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff-index --quiet HEAD || git commit -m "Auto-update news feed"
          git push
